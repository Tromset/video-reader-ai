[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "video-reader-ai"
version = "0.1.0"
description = "Turn any video into an AI-digestible digest: timestamped transcript + key frames."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["yt-dlp>=2024.1.0", "imageio-ffmpeg>=0.5"]

[project.optional-dependencies]
whisper = ["faster-whisper>=1.0"]
dev = ["pytest>=7"]

[project.scripts]
video-reader = "video_reader.cli:main"

[tool.setuptools]
packages = ["video_reader"]
